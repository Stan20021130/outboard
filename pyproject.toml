[project]
name = "outboard"
version = "2.0.0"
description = "Outboard: High-Efficiency Offload Engine for Coding Agents over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "openai>=2.40,<3",
  "pydantic>=2.11,<3",
  "pytest>=7,<10",
]

[project.scripts]
outboard = "trajectory_offload.cli:main"
trajectory-offload = "trajectory_offload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trajectory_offload"]

